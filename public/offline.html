<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FDF6EE" />
  <title>Vibe Cooking - 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FDF6EE;
      color: #5C4A3A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 320px;
    }
    .emoji {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #3D2E22;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #8B7B6E;
      margin-bottom: 24px;
    }
    button {
      background: #D4654A;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">📡</div>
    <h1>你目前处于离线状态</h1>
    <p>请检查网络连接后重试，连接恢复后即可继续使用 Vibe Cooking</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
